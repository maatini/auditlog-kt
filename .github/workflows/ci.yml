# CI for auditlog-kt (Kotlin 2.1+ version)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Show versions
        run: |
          java -version
          mvn --version
          echo "Kotlin version from pom: $(grep -oP '<kotlin.version>\K[^<]+' pom.xml || echo 'n/a')"

      - name: Build & Unit Tests
        run: mvn clean test -Djacoco.skip=true -B

      - name: Integration Tests
        run: mvn test -Pintegration -Djacoco.skip=true -B
        env:
          AUDITLOG_JDBC_URL: jdbc:postgresql://localhost:5432/audit_test
          AUDITLOG_JDBC_USER: test
          AUDITLOG_JDBC_PASS: test

  coverage:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test with JaCoCo
        run: mvn test jacoco:report -B

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: PIT Mutation Testing
        run: mvn pitest:mutationCoverage -B

      - name: Upload PIT report
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/

  security-scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-dependency-check-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-owasp-dependency-check-

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [ -z "${NVD_API_KEY}" ]; then
            # Without a key the NVD REST API is rate-limited and can stall for hours.
            # The bulk feed avoids that paging loop; a present key still uses the API.
            args+=("-DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz")
          fi
          mvn dependency-check:check -B "${args[@]}"

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
